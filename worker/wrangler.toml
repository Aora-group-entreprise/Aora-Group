name = "aora-group"
main = "src/index.js"
compatibility_date = "2026-11-17"

# Preserve variables configured in the Cloudflare dashboard during code deployments.
keep_vars = true

[vars]
SUPABASE_URL = "https://rpuygrowpdwevngqcwnb.supabase.co"
# Replace "*" with the exact public website origin before production.
# Autoriser uniquement le site public Cloudflare Pages.
ALLOWED_ORIGIN = "https://aora-group.pages.dev"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false

# Encrypted Worker secrets; values are configured in the Cloudflare dashboard/CLI.
[secrets]
required = ["SUPABASE_SERVICE_ROLE_KEY", "ADMIN_TOKEN"]

